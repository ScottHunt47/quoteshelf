<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quote Shelf</title>
<meta name="description" content="Save and revisit quotes from the books you read.">
<meta name="theme-color" content="#1f5f74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quotes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a reading app. Library shelf of generated covers -> book page with its highlights; add flows open as a bottom sheet. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18232b; --muted:#5d6b73; --line:#d9e0df;
  --accent:#1f5f74; --accent-ink:#ffffff; --mark:#ffe66b; --mark-ink:#18232b; --danger:#b3261e;
  --c1:#2f5d62; --c2:#7a4a2b; --c3:#3d4f7c; --c4:#6b3f5c; --c5:#4f6a3a; --c6:#8a5a18; --c7:#29464f; --c8:#5a3a3a;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181d; --surface:#18222a; --ink:#e7ecee; --muted:#9aa8b0; --line:#2a3842;
  --accent:#7cc4d8; --accent-ink:#0d1a20; --mark:#5b5121; --mark-ink:#fbf3c4; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181d; --surface:#18222a; --ink:#e7ecee; --muted:#9aa8b0; --line:#2a3842;
  --accent:#7cc4d8; --accent-ink:#0d1a20; --mark:#5b5121; --mark-ink:#fbf3c4; --danger:#ff8a80; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 80px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:600;font-size:1.35rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{display:inline-block;width:14px;height:18px;background:var(--mark);border-radius:2px;transform:skewX(-8deg)}
.top .grow{flex:1}
.status{font-size:.78rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:.82rem}

.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* review strip */
.review{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:10px}
.review blockquote{margin:0;font-family:var(--serif);font-size:1.2rem;line-height:1.55}
.review .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.88rem}

.search{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:28px}
.section-head h2{font-family:var(--serif);font-size:1.25rem;font-weight:600}

.shelf{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 18px}
.book{background:none;border:0;padding:0;text-align:left;display:grid;gap:8px;min-width:0}
.cover{aspect-ratio:2/3;max-width:100%;border-radius:3px 7px 7px 3px;padding:14px 12px;color:#f7f3ea;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.15),0 6px 14px -8px rgba(0,0,0,.4);transition:transform .15s}
.book:hover .cover{transform:translateY(-3px)}
.cover .ct{font-family:var(--serif);font-weight:600;font-size:1rem;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover .ca{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85;overflow-wrap:anywhere}
.book .count{font-size:.82rem;color:var(--muted)}
.book .count b{color:var(--ink);font-variant-numeric:tabular-nums}

.empty{margin-top:28px;border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--serif);font-size:1.3rem}
.empty p{margin:0;color:var(--muted);max-width:42ch}

/* book page */
.bookhead{margin-top:20px;display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:end}
.bookhead .cover{width:110px}
.bookhead h1{font-family:var(--serif);font-size:1.7rem;line-height:1.2;font-weight:600}
.bookhead .by{color:var(--muted);margin-top:4px}
.bookhead .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
@media (max-width:460px){.bookhead{grid-template-columns:84px 1fr;gap:14px}.bookhead .cover{width:84px;padding:10px 8px}.bookhead .cover .ct{font-size:.8rem}.bookhead h1{font-size:1.35rem}}

.quotes{margin-top:22px;display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:10px;min-width:0}
.q .text{font-family:var(--serif);font-size:1.08rem;line-height:1.6;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.q .text span{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 88%,transparent 88%);color:var(--mark-ink);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px}
.q .note{border-left:2px solid var(--line);padding-left:12px;color:var(--muted);font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.q .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.82rem;color:var(--muted)}
.q .foot .src{flex:1;min-width:0}
.pg{font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.88rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{font-family:var(--serif);font-size:1.3rem;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-weight:600;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.field{display:grid;gap:6px}
.field label{font-size:.85rem;font-weight:600}
.field label em{font-style:normal;font-weight:400;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%}
.field textarea{resize:vertical;min-height:80px}
.field textarea.big{min-height:140px;font-family:var(--serif);font-size:1.02rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.err{color:var(--danger);font-size:.85rem;margin:0}
.hint{color:var(--muted);font-size:.82rem;margin:0}
.results{display:grid;gap:8px}
.res{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left}
.res .mini{width:36px;aspect-ratio:2/3;border-radius:2px 4px 4px 2px;box-shadow:inset 3px 0 0 rgba(0,0,0,.2)}
.res .rt{font-weight:600;overflow-wrap:anywhere}
.res .ra{color:var(--muted);font-size:.85rem}
.res:hover{border-color:var(--accent)}
.linked{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem}
.linked b{font-family:var(--serif)}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:30}
.loading{margin-top:60px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* standalone additions */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
.cover{position:relative;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.res .mini{position:relative;overflow:hidden}
.res .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setting{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.setting h3{font-size:1rem}
.setting p{margin:0;color:var(--muted);font-size:.88rem}
.setting .btns{display:flex;flex-wrap:wrap;gap:8px}
.banner{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem}
.banner p{margin:0;flex:1;min-width:200px}
@media (max-width:420px){#addBookTop .long{display:none}}
/* scanner */
.scanbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scanbar select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.82rem}
.scan-img{position:relative;border-radius:8px;overflow:hidden;line-height:0;background:var(--line);user-select:none;-webkit-user-select:none}
.scan-img img{width:100%;display:block}
.scan-img.busy img{opacity:.45}
.ln{position:absolute;border:0;padding:0;margin:0;border-radius:3px;background:rgba(31,95,116,.16);box-shadow:0 0 0 1px rgba(31,95,116,.55);cursor:pointer}
.ln.on{background:rgba(255,222,40,.75);mix-blend-mode:multiply;box-shadow:0 0 0 1.5px #b08d00}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.picked{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--serif);font-size:.98rem;max-height:9em;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.picked:empty::before{content:"Tap lines on the photo to pick them.";color:var(--muted);font-family:var(--sans);font-size:.88rem}
/* share as image */
.share-stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;place-items:center;min-height:200px}
.share-stage canvas{display:block;max-width:100%;max-height:42vh;width:auto;height:auto;border-radius:4px;box-shadow:0 6px 24px -10px rgba(0,0,0,.45)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.ratio{width:52px;height:46px;border:1px solid transparent;background:none;border-radius:10px;display:grid;place-items:center;padding:0;color:var(--muted)}
.ratio i{display:block;border:2px solid currentColor;border-radius:4px}
.ratio[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.pill{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 16px;font-weight:600;font-size:.9rem;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.share-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-btns .btn{justify-content:center;padding:11px 14px}
.share-btns .wide{grid-column:1/-1}
.chk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.85rem;color:var(--muted)}
.scan-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-24px - env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" type="button"><i aria-hidden="true"></i>Quote Shelf</button>
    <span class="grow"></span>
    <button class="iconbtn" id="settingsBtn" type="button" aria-label="Backup and settings">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    </button>
    <button class="btn primary" id="addBookTop" type="button">+ <span class="long">Add </span>book</button>
  </header>
  <main id="app"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="camFile" accept="image/*" capture="environment" hidden>
<input type="file" id="picFile" accept="image/*" hidden>

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COVERS = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"];
const coverColor = t => { let h = 0; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return `var(${COVERS[h % COVERS.length]})`; };
const coverUrl = (id, size = "M") => id ? `https://covers.openlibrary.org/b/id/${encodeURIComponent(id)}-${size}.jpg` : "";

const KEY = "quote-shelf-v1";
const state = { books: [], quotes: [], view: { name: "library" }, filter: "", lastBackup: 0 };

/* ---------- storage: on this device ---------- */
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "{}");
    state.books = s.books || []; state.quotes = s.quotes || []; state.lastBackup = s.lastBackup || 0;
  } catch {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ books: state.books, quotes: state.quotes, lastBackup: state.lastBackup })); return true; }
  catch { toast("Couldn't save. Your phone may be out of storage."); return false; }
}
function put(kind, obj) {
  const list = state[kind]; const i = list.findIndex(x => x.id === obj.id);
  if (i >= 0) list[i] = obj; else list.push(obj);
  save(); render();
}
function del(kind, id) { state[kind] = state[kind].filter(x => x.id !== id); save(); render(); }
// Ask the browser not to clear our data when space runs low.
try { navigator.storage?.persist?.(); } catch {}

/* ---------- helpers ---------- */
const bookOf = id => state.books.find(b => b.id === id);
const quotesFor = id => state.quotes.filter(q => q.bookId === id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
function coverHTML(b, cls = "cover", size = "M") {
  const img = b.coverId ? `<img src="${coverUrl(b.coverId, size)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<div class="${cls}" style="background:${coverColor(b.title + b.author)}"><div class="ct">${esc(b.title)}</div><div class="ca">${esc(b.author || "Unknown author")}</div>${img}</div>`;
}
let toastTimer;
function toast(msg) { const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer = setTimeout(() => r.innerHTML = "", 2600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { toast("Couldn't copy. Select the text to copy it."); }
}
function go(view) { state.view = view; render(); window.scrollTo(0, 0); }
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- views ---------- */
let reviewId = null;
function render() {
  const v = state.view;
  if (v.name === "book" && !bookOf(v.id)) state.view = { name: "library" };
  state.view.name === "book" ? renderBook(state.view.id) : renderLibrary();
}

function quoteCard(q, showSource) {
  const b = bookOf(q.bookId) || { title: q.bookTitle, author: q.author };
  const confirming = state.confirmQuote === q.id;
  return `<article class="q" data-q="${q.id}">
    <p class="text"><span>${esc(q.text)}</span></p>
    ${q.note ? `<div class="note">${esc(q.note)}</div>` : ""}
    <div class="foot">
      <span class="src">${showSource ? `<b>${esc(b.title)}</b> · ${esc(b.author || "")}` : ""}</span>
      ${q.page ? `<span class="pg">p. ${esc(q.page)}</span>` : ""}
      ${confirming
        ? `<span class="confirm">Delete this quote? <button class="btn sm danger" data-act="delq-yes">Delete</button><button class="btn sm ghost" data-act="delq-no">Keep</button></span>`
        : `<button class="btn sm ghost" data-act="share">Share</button><button class="btn sm ghost" data-act="copy">Copy</button><button class="btn sm ghost" data-act="editq">Edit</button><button class="btn sm ghost" data-act="delq">Delete</button>`}
    </div>
  </article>`;
}

function backupBanner() {
  const n = state.quotes.length;
  const stale = n >= 10 && Date.now() - (state.lastBackup || 0) > 30 * 864e5;
  if (!stale) return "";
  return `<div class="banner"><p>Your quotes are stored only on this phone. ${state.lastBackup ? "Your last backup was over a month ago." : "You haven't made a backup yet."}</p><button class="btn sm primary" data-act="export-json">Back up now</button></div>`;
}

function renderLibrary() {
  const app = $("#app");
  if (!state.books.length) {
    app.innerHTML = `<div class="empty">
      <h2>Your shelf is empty</h2>
      <p>Add the book you're reading now, then save the lines worth keeping. Search by title or author, or type the details yourself.</p>
      <button class="btn primary" data-act="addbook">+ Add your first book</button>
      <button class="btn ghost sm" data-act="import">Restore from a backup</button>
    </div>`;
    return;
  }
  const f = state.filter.trim().toLowerCase();
  let review = "";
  if (state.quotes.length && !f) {
    if (!reviewId || !state.quotes.some(q => q.id === reviewId)) reviewId = state.quotes[Math.floor(Math.random() * state.quotes.length)].id;
    const q = state.quotes.find(x => x.id === reviewId); const b = bookOf(q.bookId) || {};
    review = `<section class="review" aria-label="Highlight to revisit" data-q="${q.id}">
      <span class="label">Revisit</span>
      <blockquote>${esc(q.text)}</blockquote>
      <div class="meta"><span>${esc(b.title || q.bookTitle)} · ${esc(b.author || q.author || "")}${q.page ? ` · p. ${esc(q.page)}` : ""}</span>
        <button class="btn sm" data-act="shuffle">Show another</button>
        <button class="btn sm ghost" data-act="share">Share</button>
        <button class="btn sm ghost" data-act="open" data-id="${q.bookId}">Open book</button></div>
    </section>`;
  }
  let body;
  if (f) {

let lastResults = [], searchCtl;
async function runSearch(q) {
  const out = $("#results"); if (!q) return;
  if (!navigator.onLine) { out.innerHTML = `<p class="hint">You're offline. Search needs a connection, or use “Enter manually”.</p>`; return; }
  searchCtl?.abort(); searchCtl = new AbortController();
  out.innerHTML = `<p class="hint">Searching for “${esc(q)}”…</p>`;
  try {
    const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&fields=key,title,author_name,first_publish_year,cover_i&limit=12`;
    const r = await fetch(url, { signal: searchCtl.signal });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    lastResults = (data.docs || []).filter(d => d.title).slice(0, 12).map(d => ({
      title: d.title, author: (d.author_name || []).slice(0, 2).join(", "), year: d.first_publish_year || "", coverId: d.cover_i || null, olKey: d.key || ""
    }));
    if (!$("#results")) return;
    out.innerHTML = lastResults.length
      ? lastResults.map((r, i) => `<button class="res" data-act="pick" data-i="${i}" type="button">
          <span class="mini" style="background:${coverColor(r.title + r.author)}">${r.coverId ? `<img src="${coverUrl(r.coverId, "S")}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>
          <span style="min-width:0"><span class="rt">${esc(r.title)}</span><br><span class="ra">${esc(r.author || "Unknown author")}${r.year ? ` · ${esc(r.year)}` : ""}</span></span>
          <span class="btn sm">Add</span></button>`).join("")
      : `<p class="hint">No matches. Try a different spelling, or enter the book manually.</p>`;
  } catch (e) {
    if (e?.name === "AbortError") return;
    if ($("#results")) out.innerHTML = `<p class="hint">Search didn't work this time. Check your connection and try again, or enter the book manually.</p>`;
  }
}

/* ---------- scanner: reads text from a photo, on the phone ---------- */
const OCR_LANGS = [["eng","English"],["fra","French"],["spa","Spanish"],["deu","German"],["ita","Italian"],["por","Portuguese"]];
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
function ocrLangPref() { try { return localStorage.getItem("qs-ocr-lang") || "eng"; } catch { return "eng"; } }
let scanCtx = null, scan = null, ocrWorker = null, ocrWorkerLang = "", ocrProgress = () => {};

function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.Tesseract) return res();
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function getWorker(lang) {
  if (ocrWorker && ocrWorkerLang === lang) return ocrWorker;
  await loadScript(TESSERACT_URL);
  if (ocrWorker) { try { await ocrWorker.terminate(); } catch {} ocrWorker = null; }
  ocrWorker = await Tesseract.createWorker(lang, 1, { logger: m => ocrProgress(m) });
  ocrWorkerLang = lang;
  return ocrWorker;
}
function readDraft() {
  return { text: $("#qt")?.value || "", page: $("#qp")?.value || "", note: $("#qn")?.value || "" };
}
function startScan(useCamera) {
  scanCtx.draft = readDraft();
  scanCtx.lang = $("#ocrLang")?.value || ocrLangPref();
  $(useCamera ? "#camFile" : "#picFile").click();
}
for (const id of ["#camFile", "#picFile"]) $(id).addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (f && scanCtx) runScan(f);
});

async function prepareImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}

async function runScan(file) {
  const sc = scan = { lines: [], picked: new Set(), w: 1, h: 1, src: "", busy: true, status: "Preparing the photo…", pct: 0, error: "" };
  renderScan();
  try {
    const canvas = await prepareImage(file);
    sc.w = canvas.width; sc.h = canvas.height; sc.src = canvas.toDataURL("image/jpeg", 0.85);
    sc.status = "Getting the text reader ready…"; renderScan();
    ocrProgress = m => {
      if (scan !== sc) return;
      const s = m.status || "";
      if (s.includes("traineddata")) sc.status = "Downloading the language pack (first time only)…";
      else if (s.includes("recognizing")) sc.status = "Reading the page…";
      else if (s.includes("core") || s.includes("api")) sc.status = "Getting the text reader ready…";
      if (typeof m.progress === "number") sc.pct = s.includes("recognizing") ? m.progress : Math.min(m.progress, 1) * 0.3;
      if (scan === sc) updateScanProgress();
    };
    if (scan !== sc) return;
    const worker = await getWorker(scanCtx.lang);
    const { data } = await worker.recognize(canvas);
    if (scan !== sc) return;
    sc.lines = (data.lines || []).map(l => ({ text: l.text.replace(/\s+/g, " ").trim(), b: l.bbox })).filter(l => l.text.length > 1);
    sc.busy = false;
    if (!sc.lines.length) sc.error = "No text found. Try again with the page flat, well lit and filling the frame.";
  } catch (err) {
    console.warn(err);
    sc.busy = false;
    sc.error = navigator.onLine
      ? "The scan didn't work. Try another photo, or type the quote instead."
      : "The first scan needs an internet connection to download the text reader. After that, scanning works offline.";
  }
  if (scan === sc) renderScan();
}

function joinLines(lines) {
  return lines.reduce((acc, t) => {
    if (!acc) return t;
    if (/[A-Za-zÀ-ÿ]-$/.test(acc) && /^[a-zà-ÿ]/.test(t)) return acc.slice(0, -1) + t;
    return acc + " " + t;
  }, "").replace(/\s+([,.;:!?])/g, "$1").trim();
}
const pickedText = () => joinLines([...scan.picked].sort((a, b) => a - b).map(i => scan.lines[i].text));

function renderScan() {
  if (!scan) return;
  const pct = v => (v * 100).toFixed(3) + "%";
  const boxes = scan.busy ? "" : scan.lines.map((l, i) => {
    const pad = 3;
    const x = Math.max(0, l.b.x0 - pad), y = Math.max(0, l.b.y0 - pad);
    return `<button type="button" class="ln${scan.picked.has(i) ? " on" : ""}" data-act="scan-line" data-i="${i}" aria-label="${esc(l.text)}" aria-pressed="${scan.picked.has(i)}"
      style="left:${pct(x / scan.w)};top:${pct(y / scan.h)};width:${pct((l.b.x1 - l.b.x0 + pad * 2) / scan.w)};height:${pct((l.b.y1 - l.b.y0 + pad * 2) / scan.h)}"></button>`;
  }).join("");
  openSheet(`
    <div class="sheet-head"><h2>Pick the lines</h2><button class="btn ghost sm" data-act="scan-back">Cancel</button></div>
    ${scan.busy ? `<div style="display:grid;gap:8px"><p class="hint" id="scanStatus">${esc(scan.status)}</p><div class="prog"><i id="scanBar" style="width:${Math.round(scan.pct * 100)}%"></i></div></div>`
      : scan.error ? `<p class="err">${esc(scan.error)}</p>`
      : `<p class="hint">Tap each line you want in the quote. Tap again to remove it.</p>`}
    ${scan.src ? `<div class="scan-img${scan.busy ? " busy" : ""}"><img src="${scan.src}" alt="Your photo of the page">${boxes}</div>` : ""}
    ${!scan.busy && !scan.error ? `<div class="field"><span class="label">Your quote</span><div class="picked" id="picked">${esc(pickedText())}</div></div>` : ""}
    <div class="scan-foot">
      ${scan.busy ? "" : `<button class="btn sm ghost" data-act="scan-retake">New photo</button>`}
      ${!scan.busy && !scan.error ? `<button class="btn sm ghost" data-act="scan-all">${scan.picked.size === scan.lines.length ? "Clear" : "Select all"}</button>
        <button class="btn primary" data-act="scan-use" ${scan.picked.size ? "" : "disabled"}>Use ${scan.picked.size || ""} line${scan.picked.size === 1 ? "" : "s"}</button>` : ""}
    </div>`);
}
function updateScanProgress() {
  const s = $("#scanStatus"), bar = $("#scanBar");
  if (s) s.textContent = scan.status;
  if (bar) bar.style.width = Math.round(scan.pct * 100) + "%";
}
function backToQuote(extraText) {
  const { bookId, quoteId, draft = {} } = scanCtx; scan = null;
  const d = { ...draft };
  if (extraText) d.text = d.text.trim() ? d.text.trim() + "\n\n" + extraText : extraText;

const SHARE_SIZES = {

const coverHex = t => { let h = 0; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COVER_HEX[h % COVER_HEX.length]; };
let shareOpts = { size: "square", style: "cover", color: { cover: "#2f3d33", clean: "#ffffff", classic: "#f4efe4" }, brand: true };
try { shareOpts = { ...shareOpts, ...JSON.parse(localStorage.getItem("qs-share") || "{}") }; } catch {}

const coverImgCache = new Map();

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lum(h) { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; }
function mix(h, to, t) { const a = hexRgb(h), b = hexRgb(to); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`; }
const isLight = h => lum(h) > 0.4;

function loadCoverImg(book) {
  if (!book?.coverId || !navigator.onLine && !coverImgCache.has(book.coverId)) return Promise.resolve(null);
  if (coverImgCache.has(book.coverId)) return coverImgCache.get(book.coverId);

    img.onerror = () => done(null);

async function shareFonts() {
  try { await Promise.all(["400 40px Literata", "italic 400 40px Literata", "600 40px Literata", "500 30px Figtree", "600 30px Figtree"].map(f => document.fonts.load(f))); } catch {}
}
function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split(/\n+/)) {
    let line = "";
    for (const word of para.split(/\s+/).filter(Boolean)) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
    }
    if (line) out.push(line);
  }
  return out;
}
function fitQuote(ctx, text, maxW, maxH, maxSize, minSize, lh, align) {
  for (let size = maxSize; size >= minSize; size -= 2) {
    ctx.font = `400 ${size}px Literata, Georgia, serif`;
    const lines = wrapLines(ctx, text, maxW);
    if (lines.length * size * lh <= maxH) return { size, lines, h: lines.length * size * lh };
  }
  ctx.font = `400 ${minSize}px Literata, Georgia, serif`;
  let lines = wrapLines(ctx, text, maxW);
  const maxLines = Math.max(1, Math.floor(maxH / (minSize * lh)));
  if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, "") + " …"; }
  return { size: minSize, lines, h: lines.length * minSize * lh };
}
function drawBookCover(ctx, img, book, cx, cy, w, h, angle, s) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(angle * Math.PI / 180);
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 40 * s; ctx.shadowOffsetX = -8 * s; ctx.shadowOffsetY = 14 * s;
  if (img) {

    const iw = img.naturalWidth * r, ih = img.naturalHeight * r;
    ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip();
    ctx.drawImage(img, -iw / 2, -ih / 2, iw, ih);
  } else {
    ctx.fillStyle = coverHex(book.title + book.author); ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.shadowColor = "transparent";
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(-w / 2, -h / 2, w * 0.06, h);
    ctx.fillStyle = "#f7f3ea"; ctx.textBaseline = "top"; ctx.textAlign = "left";
    const pad = w * 0.12;
    ctx.font = `600 ${Math.round(w * 0.1)}px Literata, Georgia, serif`;
    const tl = wrapLines(ctx, book.title, w - pad * 2).slice(0, 5);
    tl.forEach((l, i) => ctx.fillText(l, -w / 2 + pad, -h / 2 + pad + i * w * 0.125));
    ctx.font = `500 ${Math.round(w * 0.055)}px Figtree, system-ui, sans-serif`;
    ctx.globalAlpha = .85; ctx.fillText((book.author || "").toUpperCase(), -w / 2 + pad, h / 2 - pad - w * 0.06);
  }
  ctx.restore();
}
function drawBrand(ctx, x, y, color, s, align = "right") {
  ctx.save();
  ctx.font = `600 ${Math.round(22 * s)}px Literata, Georgia, serif`;
  ctx.textBaseline = "alphabetic";
  const label = "Quote Shelf", tw = ctx.measureText(label).width, mw = 13 * s, gap = 9 * s;
  const left = align === "right" ? x - tw - mw - gap : align === "center" ? x - (tw + mw + gap) / 2 : x;
  ctx.fillStyle = "#ffe36b";
  ctx.beginPath(); const mh = 17 * s, my = y - mh + 2 * s;
  ctx.moveTo(left + 3 * s, my); ctx.lineTo(left + mw + 3 * s, my); ctx.lineTo(left + mw, my + mh); ctx.lineTo(left, my + mh); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color; ctx.globalAlpha = .75; ctx.textAlign = "left";
  ctx.fillText(label, left + mw + gap, y);
  ctx.restore();
}

async function drawShare(canvas, q, opts) {
  const token = ++shareToken;
  const b = bookOf(q.bookId) || { title: q.bookTitle || "", author: q.author || "" };
  const { w: W, h: H } = SHARE_SIZES[opts.size];
  const style = opts.style, bg = opts.color[style] || SHARE_STYLES[style].colors[0];
  const light = isLight(bg);
  const ink = light ? "#1a2026" : "#f7f4ee", soft = light ? "rgba(26,32,38,.62)" : "rgba(247,244,238,.7)";
  const [, img] = await Promise.all([shareFonts(), style === "cover" ? loadCoverImg(b) : null]);
  if (token !== shareToken) return;
  shareBlob = null;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const s = W / 1080, landscape = W / H >= 0.95, pad = Math.round((landscape ? 76 : 96) * s);
  const titleSize = Math.round(28 * s), authorSize = Math.round(24 * s);
  const footerH = titleSize * 1.35 + authorSize * 1.3 + 30 * s;

  // background
  if (style === "cover") {
    const g = ctx.createLinearGradient(0, 0, W, H * 0.4);
    g.addColorStop(0, bg); g.addColorStop(1, mix(bg, light ? "#000000" : "#ffffff", light ? 0.06 : 0.14));
    ctx.fillStyle = g;
  } else ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // layout box for the quote
  let box;
  if (style === "cover") {
    if (landscape) {
      const ch = H * (W / H > 1.4 ? 1.08 : 0.82), cw = ch * 0.66;
      drawBookCover(ctx, img, b, W - cw * 0.2, H / 2, cw, ch, 6, s);
      box = { x: pad + 26 * s, y: pad, w: W - cw * 0.82 - pad * 1.6 - 26 * s, h: H - pad * 2 };
    } else {
      const cw = W * (opts.size === "story" ? 0.5 : 0.36), ch = cw * 1.5;
      const top = opts.size === "story" ? H * 0.1 : pad * 0.8;
      drawBookCover(ctx, img, b, W / 2, top + ch / 2, cw, ch, -4, s);
      const y = top + ch + pad * 0.9;
      box = { x: pad + 26 * s, y, w: W - pad * 2 - 26 * s, h: H - y - pad };
    }
  } else if (style === "clean") {
    box = { x: pad + 26 * s, y: pad, w: W - pad * 2 - 26 * s, h: H - pad * 2 - (opts.brand ? 30 * s : 0) };
  } else {
    box = { x: pad * 1.15, y: pad + 60 * s, w: W - pad * 2.3, h: H - pad * 2 - 60 * s - (opts.brand ? 30 * s : 0) };
  }

  const center = style === "classic";
  const maxQ = Math.round((landscape ? 50 : opts.size === "story" ? 64 : 58) * s);
  const fit = fitQuote(ctx, q.text, box.w, box.h - footerH, maxQ, Math.round(20 * s), 1.45);
  const blockH = fit.h + footerH;
  const top = box.y + Math.max(0, (box.h - blockH) / 2);
  const accent = style === "clean" && bg === "#1f5f74" ? "#ffe36b" : light ? "#1a2026" : "#f7f4ee";

  // classic: large quotation mark
  if (style === "classic") {
    ctx.fillStyle = light ? "#b08d2a" : "#e3c46a";
    ctx.font = `600 ${Math.round(150 * s)}px Literata, Georgia, serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("“", W / 2, top + 20 * s);
  }
  // bar beside the quote
  if (style !== "classic") { ctx.fillStyle = accent; ctx.fillRect(box.x - 26 * s, top + fit.size * 0.18, 6 * s, fit.h - fit.size * 0.3); }

  // quote text
  ctx.fillStyle = ink; ctx.textBaseline = "top"; ctx.textAlign = center ? "center" : "left";
  ctx.font = `400 ${fit.size}px Literata, Georgia, serif`;
  const tx = center ? W / 2 : box.x;
  fit.lines.forEach((l, i) => ctx.fillText(l, tx, top + i * fit.size * 1.45 + fit.size * 0.1));

  // title and author
  let fy = top + fit.h + 30 * s;
  if (center) { ctx.fillStyle = soft; ctx.fillRect(W / 2 - 24 * s, fy - 10 * s, 48 * s, 2 * s); fy += 14 * s; }
  ctx.fillStyle = ink;
  ctx.font = center ? `600 ${Math.round(titleSize * .82)}px Figtree, system-ui, sans-serif` : `500 ${titleSize}px Figtree, system-ui, sans-serif`;
  if (center && "letterSpacing" in ctx) ctx.letterSpacing = `${2 * s}px`;
  const titleText = center ? b.title.toUpperCase() : b.title;
  ctx.fillText(wrapLines(ctx, titleText, box.w)[0] || "", tx, fy);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  ctx.fillStyle = soft; ctx.font = `400 ${authorSize}px Figtree, system-ui, sans-serif`;
  ctx.fillText((b.author || "") + (q.page ? ` · p. ${q.page}` : ""), tx, fy + titleSize * 1.35);

  // app name
  if (opts.brand) {
    if (style === "cover" && landscape) drawBrand(ctx, box.x, H - pad * 0.55, ink, s, "left");
    else if (center) drawBrand(ctx, W / 2, H - pad * 0.7, ink, s, "center");
    else drawBrand(ctx, W - pad, H - pad * 0.6, ink, s, "right");
  }
  canvas.toBlob(bl => { if (token === shareToken) shareBlob = bl; }, "image/png");
}

function shareSheet(qid) {
  shareQ = state.quotes.find(x => x.id === qid); if (!shareQ) return;
  const keepY = $(".sheet")?.querySelector("#shareCanvas") ? $(".sheet").scrollTop : 0;
  const st = SHARE_STYLES[shareOpts.style];
  const cur = shareOpts.color[shareOpts.style] || st.colors[0];
  const canFiles = !!(navigator.canShare && window.File);
  openSheet(`
    <div class="sheet-head"><h2>Share quote</h2><button class="btn ghost sm" data-act="close">Close</button></div>
    <div class="share-stage"><canvas id="shareCanvas" aria-label="Preview of the quote image"></canvas></div>
    <div class="opt-row" role="group" aria-label="Size">${Object.entries(SHARE_SIZES).map(([k, v]) =>
      `<button class="ratio" data-act="share-size" data-v="${k}" aria-pressed="${k === shareOpts.size}" aria-label="${v.label}" title="${v.label}"><i style="width:${v.icon[0]}px;height:${v.icon[1]}px"></i></button>`).join("")}</div>
    <div class="opt-row" role="group" aria-label="Style">${Object.entries(SHARE_STYLES).map(([k, v]) =>
      `<button class="pill" data-act="share-style" data-v="${k}" aria-pressed="${k === shareOpts.style}">${v.label}</button>`).join("")}</div>
    <div class="opt-row" role="group" aria-label="Colour">${st.colors.map(c =>
      `<button class="sw" data-act="share-color" data-v="${c}" aria-pressed="${c === cur}" aria-label="Colour ${c}" style="background:${c}"></button>`).join("")}</div>
    <label class="chk"><input type="checkbox" id="shareBrand" ${shareOpts.brand ? "checked" : ""}> Show the Quote Shelf name</label>
    <div class="share-btns">
      ${canFiles ? `<button class="btn primary wide" data-act="share-image">Share image</button>` : ""}
      <button class="btn${canFiles ? "" : " primary wide"}" data-act="share-save">Save image</button>
      <button class="btn${canFiles ? "" : " wide"}" data-act="share-text">Share text</button>
    </div>`);
  $("#shareBrand").addEventListener("change", e => { shareOpts.brand = e.target.checked; persistShare(); drawShare($("#shareCanvas"), shareQ, shareOpts); });
  if (keepY) $(".sheet").scrollTop = keepY;
  drawShare($("#shareCanvas"), shareQ, shareOpts);
}
function persistShare() { try { localStorage.setItem("qs-share", JSON.stringify(shareOpts)); } catch {} }
function shareFileName() {
  const b = bookOf(shareQ.bookId) || {};
  return `quote-${(b.title || "book").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40)}.png`;
}
function canvasBlob() { return shareBlob ? Promise.resolve(shareBlob) : new Promise((res, rej) => $("#shareCanvas").toBlob(bl => bl ? res(bl) : rej(new Error("blob")), "image/png")); }
function quoteText(q) {
  const b = bookOf(q.bookId) || {};
  return `“${q.text}”\n— ${b.author || q.author}, ${b.title || q.bookTitle}${q.page ? `, p. ${q.page}` : ""}`;
}
async function shareImage() {
  try {
    const blob = shareBlob || await canvasBlob();
    const file = new File([blob], shareFileName(), { type: "image/png" });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    toast("Sharing images isn't supported here. Saving instead."); saveImage();
  } catch (e) { if (e?.name !== "AbortError") toast("Couldn't share the image. Try Save image instead."); }
}
async function saveImage() {
  try {
    const url = URL.createObjectURL(await canvasBlob());
    const a = document.createElement("a"); a.href = url; a.download = shareFileName(); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast("Image saved");
  } catch { toast("Couldn't save the image."); }
}
async function shareText() {
  const text = quoteText(shareQ);
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e?.name === "AbortError") return; } }
  copy(text);
}

/* ---------- backup ---------- */
function settingsSheet() {
  const last = state.lastBackup ? new Date(state.lastBackup).toLocaleDateString() : "never";
  openSheet(`
    <div class="sheet-head"><h2>Backup</h2><button class="btn ghost sm" data-act="close">Close</button></div>
    <div class="setting">
      <h3>Back up your library</h3>
      <p>Your ${state.books.length} book${state.books.length === 1 ? "" : "s"} and ${state.quotes.length} quote${state.quotes.length === 1 ? "" : "s"} are stored only on this device. Save a backup file to iCloud, Google Drive or email it to yourself. Last backup: ${esc(last)}.</p>
      <div class="btns"><button class="btn primary" data-act="export-json">Save backup file</button></div>
    </div>
    <div class="setting">
      <h3>Restore from a backup</h3>
      <p>Adds the books and quotes from a backup file. Anything already here is kept.</p>
      <div class="btns"><button class="btn" data-act="import">Choose backup file</button></div>
    </div>
    <div class="setting">
      <h3>Export as Markdown</h3>
      <p>A readable file with every quote grouped by book, for Obsidian, Notion or notes apps.</p>
      <div class="btns"><button class="btn" data-act="export-md">Export Markdown</button></div>
    </div>`);
}
function exportJSON() {
  state.lastBackup = Date.now(); save();
  downloadFile(`quote-shelf-backup-${today()}.json`, JSON.stringify({ app: "quote-shelf", version: 1, exportedAt: new Date().toISOString(), books: state.books, quotes: state.quotes }, null, 2), "application/json");
  toast("Backup saved"); render();
}
function exportMD() {
  const books = [...state.books].sort((a, b) => a.title.localeCompare(b.title));
  const md = books.map(b => {
    const qs = quotesFor(b.id).reverse();
    return `## ${b.title}\n*${b.author || "Unknown author"}${b.year ? `, ${b.year}` : ""}*\n\n` +
      (qs.length ? qs.map(q => `> ${q.text.replace(/\n/g, "\n> ")}\n${q.page ? `\n— p. ${q.page}\n` : ""}${q.note ? `\n**Note:** ${q.note}\n` : ""}`).join("\n---\n\n") : "_No quotes yet._\n");
  }).join("\n\n");
  downloadFile(`quote-shelf-${today()}.md`, `# Quote Shelf\n\n${md}\n`, "text/markdown");
  toast("Markdown exported");
}
$("#importFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.books) || !Array.isArray(data.quotes)) throw new Error("shape");
    let nb = 0, nq = 0;
    for (const b of data.books) if (b?.id && b.title && !bookOf(b.id)) { state.books.push(b); nb++; }
    for (const q of data.quotes) if (q?.id && q.text && q.bookId && !state.quotes.some(x => x.id === q.id)) { state.quotes.push(q); nq++; }
    save(); closeSheet(); go({ name: "library" });
    toast(nb || nq ? `Restored ${nb} book${nb === 1 ? "" : "s"} and ${nq} quote${nq === 1 ? "" : "s"}` : "Everything in that backup is already here");
  } catch { toast("That file isn't a Quote Shelf backup."); }
});

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act; const qid = t.closest("[data-q]")?.dataset.q;
  switch (act) {
    case "close-scrim": if (e.target === t) closeSheet(); break;
    case "close": closeSheet(); break;
    case "addbook": addBookSheet(); break;
    case "tab": addBookSheet(t.dataset.tab); break;
    case "pick": { const r = lastResults[+t.dataset.i]; if (r) addBook(r); break; }
    case "open": state.filter = ""; go({ name: "book", id: t.dataset.id }); break;
    case "back": go({ name: "library" }); break;
    case "shuffle": { if (state.quotes.length > 1) { let n; do n = state.quotes[Math.floor(Math.random() * state.quotes.length)].id; while (n === reviewId); reviewId = n; } render(); break; }
    case "addquote": quoteSheet(state.view.id); break;
    case "scan-cam": startScan(true); break;
    case "scan-pic": startScan(false); break;
    case "scan-line": { const i = +t.dataset.i; scan.picked.has(i) ? scan.picked.delete(i) : scan.picked.add(i);
      const y = $(".sheet").scrollTop; renderScan(); $(".sheet").scrollTop = y; break; }
    case "scan-all": { scan.picked = scan.picked.size === scan.lines.length ? new Set() : new Set(scan.lines.map((_, i) => i));
      const y = $(".sheet").scrollTop; renderScan(); $(".sheet").scrollTop = y; break; }
    case "scan-use": backToQuote(pickedText()); break;
    case "scan-back": backToQuote(""); break;
    case "scan-retake": $("#camFile").click(); break;
    case "editbook": addBookSheet("manual", state.view.id); break;
    case "editq": { const q = state.quotes.find(x => x.id === qid); quoteSheet(q.bookId, qid); break; }
    case "share": shareSheet(qid); break;
    case "share-size": shareOpts.size = t.dataset.v; persistShare(); shareSheet(shareQ.id); break;
    case "share-style": shareOpts.style = t.dataset.v; persistShare(); shareSheet(shareQ.id); break;
    case "share-color": shareOpts.color = { ...shareOpts.color, [shareOpts.style]: t.dataset.v }; persistShare(); shareSheet(shareQ.id); break;
    case "share-image": shareImage(); break;
    case "share-save": saveImage(); break;
    case "share-text": shareText(); break;
    case "copy": { const q = state.quotes.find(x => x.id === qid); const b = bookOf(q.bookId) || {};
      copy(`“${q.text}”\n— ${b.author || q.author}, ${b.title || q.bookTitle}${q.page ? `, p. ${q.page}` : ""}`); break; }
    case "delq": state.confirmQuote = qid; render(); break;
    case "delq-no": state.confirmQuote = null; render(); break;
    case "delq-yes": state.confirmQuote = null; del("quotes", qid); toast("Quote deleted"); break;
    case "delbook": state.confirmBook = state.view.id; render(); break;
    case "delbook-no": state.confirmBook = null; render(); break;
    case "delbook-yes": {
      const id = state.view.id; state.confirmBook = null;
      state.quotes = state.quotes.filter(q => q.bookId !== id); del("books", id); go({ name: "library" }); toast("Book deleted"); break;
    }
    case "export-json": exportJSON(); break;
    case "export-md": exportMD(); break;
    case "import": $("#importFile").click(); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "filter") { state.filter = e.target.value; renderLibrary(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet(); });
$("#home").addEventListener("click", () => { state.filter = ""; go({ name: "library" }); });
$("#addBookTop").addEventListener("click", () => addBookSheet());
$("#settingsBtn").addEventListener("click", settingsSheet);
window.addEventListener("storage", e => { if (e.key === KEY) { load(); render(); } });

load(); render();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
